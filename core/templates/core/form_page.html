{% extends "core/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width:760px">
  <h3>{{ title }}</h3>{% if subtitle %}<p class="text-muted">{{ subtitle }}</p>{% endif %}
  <form method="post"{% if multipart %} enctype="multipart/form-data"{% endif %}>{% csrf_token %}
    {% include "core/_form.html" %}
    <button class="btn btn-primary w-100">{{ submit|default:"Save" }}</button>
  </form>
</div>
{% endblock %}
