{% extends "registration/auth_base.html" %}
{% block title %}Forgot Password{% endblock %}{% block heading %}Forgot Password{% endblock %}
{% block content %}
<form method="post">{% csrf_token %}{{ form.email }}{% for e in form.email.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
<button class="btn btn-primary w-100">Send OTP</button></form>
<div class="text-center mt-3"><a href="{% url 'login' %}">Back to Login</a></div>
{% endblock %}
